[workspace]
resolver = "2"
members = [
  "apps/web",
  "crates/core",
  "crates/contracts",
  "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
authors = ["MW-BOILERPLATE contributors"]

[workspace.dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
mw-core = { path = "crates/core" }
mw-contracts = { path = "crates/contracts" }
mw-ui = { path = "crates/ui" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
